[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "satrain_now"
dynamic = ["version"]
description = "Benchmark dataset for satellite precipitation nowcasting and analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cartopy",
    "click",
    "h5netcdf",
    "matplotlib",
    "numcodecs",
    "pyresample>=1.27",
    "s3fs",
    "xarray",
    "zarr>=3.0",
    "jupyterlab",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
satrain_now = "satrain_now.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
